[project]
name = "fraud-detection"
version = "0.1.0"
description = "Hybrid credit card fraud detection system — CO7201 MSc Computing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap==0.48.0",
    "uvicorn>=0.52.1",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
